name: Docker Build & Publish

on:
  push:
    branches: [ "main", "master" ]
    # Trigger on semver tags (e.g., v1.0.0)
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]
  # Run a security scan daily at 04:00 UTC
  schedule:
    - cron: '0 4 * * *'
  # Allow manual trigger for debugging
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # JOB 1: Security Assessment
  # Determines if a build is necessary based on the event type and security status.
  check-necessity:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Check trigger type
        id: trigger
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "Event is ${{ github.event_name }}. Build required."
            echo "is_schedule=false" >> "$GITHUB_OUTPUT"
          else
            echo "Schedule event detected. Scanning current published image for fixable vulnerabilities..."
            echo "is_schedule=true" >> "$GITHUB_OUTPUT"
          fi

      # Only runs on the nightly schedule trigger. Scans the already-published
      # ':latest' image to decide whether a rebuild (to pick up patches) is
      # worthwhile. continue-on-error lets us turn "vulnerabilities found"
      # into a should_build=true decision instead of failing this job.
      - name: Scan published image (schedule only)
        if: steps.trigger.outputs.is_schedule == 'true'
        id: scheduled-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Decide
        id: decision
        run: |
          if [[ "${{ steps.trigger.outputs.is_schedule }}" != "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.scheduled-scan.outcome }}" == "failure" ]]; then
            echo "Critical vulnerabilities found in published image! Triggering build to apply security patches."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No critical, fixable vulnerabilities found. Skipping build to save resources."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  # JOB 2: Build & Push
  # Runs only if the previous job determined it is necessary.
  build-and-push:
    needs: check-necessity
    if: needs.check-necessity.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set up QEMU to allow building for ARM64 (Raspberry Pi) on an AMD64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build a single-arch (amd64) image locally, purely to scan it before
      # anything is pushed. Buildx can't `--load` a multi-platform manifest,
      # so this is the arch that gets a pre-push gate; arm64 is still covered
      # (post-push) by the nightly scheduled scan against the published
      # multi-arch manifest.
      - name: Build amd64 image for pre-push scan
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: scan-to-paperless:pre-push-scan
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan amd64 image before push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-to-paperless:pre-push-scan
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # Login to GitHub Container Registry
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # Logic:
      # - Push to main: Tags as 'main'
      # - Push tag v1.0.0: Tags as '1.0.0', '1.0', '1', and 'latest'
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # Build and push the image. Only reached if the pre-push scan above
      # passed. 'no-cache' is enabled only for scheduled builds to ensure
      # fresh packages are downloaded.
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
